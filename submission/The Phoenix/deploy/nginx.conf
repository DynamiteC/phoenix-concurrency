# Port 80 is the only thing this host publishes.
#
# Everything else (the console on 3200, LibreChat on 3080, its admin panel on 3000, the MCP server
# on 8000) stays on the compose network. The previous runbook's security-group note listed four
# ports to keep closed and forgot 3000, which the LibreChat compose file publishes; routing
# everything through one proxy makes that class of omission impossible rather than documented.

upstream console {
    server web:3200;
}

server {
    listen 80 default_server;
    server_name _;

    # The consoles poll on a 5-second tick and the Ask route can take up to 60s against a model,
    # so the read timeout is set from the app's own ASK_TIMEOUT_MS rather than left at nginx's 60s
    # default, which would cut a slow answer off exactly at the point it was about to arrive.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Never log the model key. It travels as a request header, and while nginx does not log
    # arbitrary headers by default, being explicit here is cheaper than discovering otherwise in
    # an access log we hand to judges.
    proxy_set_header X-LLM-Key $http_x_llm_key;

    # LibreChat, mounted under a path so it shares port 80 with the console. Trailing slashes on
    # both sides: /chat/foo reaches LibreChat as /foo.
    # LAZILY RESOLVED, and that is the whole point of the variable. nginx resolves a literal
    # upstream at STARTUP and exits if the name is missing, so with `proxy_pass http://api:3080`
    # the entire site refused to start whenever the LibreChat profile was down: the concurrency
    # curve, which is the mandatory deliverable, was taken offline by an optional chat service.
    # Assigning the host to a variable defers resolution to request time, so /chat/ 502s while
    # everything else serves.
    location /chat/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $librechat_host "api:3080";
        rewrite ^/chat/(.*)$ /$1 break;
        proxy_pass http://$librechat_host;
        # LibreChat streams and uses websockets; without the upgrade headers the chat hangs open
        # and returns nothing, which looks exactly like a broken model key.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Everything else is the console: / is v1, /v2 is the insight console.
    location / {
        proxy_pass http://console;
    }
}
