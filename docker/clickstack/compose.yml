# ClickStack (HyperDX + OpenTelemetry collector) pointed at our ClickHouse Cloud service.
#
#   cd docker/clickstack && docker compose --env-file ../../.env up -d
#   open http://localhost:8080
#
# WHY THE ALL-IN-ONE IMAGE AND NOT THE COMPONENT CHARTS: the image ships HyperDX, the OTel
# collector, and a local ClickHouse in one container. We supply CLICKHOUSE_ENDPOINT, which
# makes it ignore its bundled ClickHouse and read ours instead. Verified against
# clickhouse.com/docs/use-cases/observability/clickstack/deployment/all-in-one this session:
# image clickhouse/clickstack-all-in-one:latest, ports 8080 (HyperDX UI), 4317 (OTLP gRPC),
# 4318 (OTLP HTTP), and the three CLICKHOUSE_* variables below are the documented override.
# The docs are explicit that the bundled instance still starts and is simply unused, so a
# running container is NOT evidence that it is reading our data. docs/clickstack.md records
# the check that is.
#
# The endpoint is the HTTPS interface on 8443, NOT the native port in .env (CH_PORT=9440).
# Pointing an HTTPS client at 9440 is exactly the bug the frontend shipped with.
services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    container_name: phoenix-clickstack
    environment:
      CLICKHOUSE_ENDPOINT: https://${CH_HOST}:8443
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
    ports:
      # 8090 on the host, not 8080: the dual-graph MCP server already holds 8080 here.
      # HyperDX still listens on 8080 inside the container, so only the left side moves.
      - "8090:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC, used by scripts/emit_query_spans.sh
      - "4318:4318"   # OTLP HTTP
    volumes:
      # Named volume so dashboards and the source registration survive a restart. Without it
      # every `down` silently discards the panel definitions and the integration looks
      # broken on the second demo rather than the first.
      - clickstack-data:/data/db
    restart: unless-stopped

volumes:
  clickstack-data:
