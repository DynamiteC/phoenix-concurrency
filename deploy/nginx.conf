# Ports 80 and 443 are what this host publishes (plus LibreChat's own 3080, published by its
# compose file). 80 exists only to redirect to HTTPS.
#
# Everything else (the console on 3200, the MCP server on 8000) stays on the compose network.
# Routing everything through one proxy makes the forgotten-open-port class of omission impossible
# rather than documented.

upstream console {
    server web:3200;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name the-phoenix.cricheroes.io;

    # Wildcard *.cricheroes.io. fullchain.pem is cricheroes.crt + cricheroes.ca-bundle.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # The consoles poll on a 5-second tick and the Ask route can take up to 60s against a model,
    # so the read timeout is set from the app's own ASK_TIMEOUT_MS rather than left at nginx's 60s
    # default, which would cut a slow answer off exactly at the point it was about to arrive.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Never log the model key. It travels as a request header, and while nginx does not log
    # arbitrary headers by default, being explicit here is cheaper than discovering otherwise in
    # an access log we hand to judges.
    proxy_set_header X-LLM-Key $http_x_llm_key;

    # LibreChat lives on its own port (see the 3080 server below), NOT under a path. Its SPA
    # ships <base href="/">, so under /chat/ every asset resolved to /assets/... and 404ed
    # through the console upstream: the page loaded, the app never did. That was the original
    # "LibreChat is not working". A path prefix cannot work without upstream base-path support,
    # so /chat/ is kept only as a redirect for old links.
    location /chat/ {
        return 301 https://$host:3080/;
    }

    # Everything else is the console: / is v1, /v2 is the insight console.
    location / {
        proxy_pass http://console;
    }
}

# LibreChat, TLS-terminated here on 3080 and proxied to the container over the compose network.
# The container itself publishes nothing; the security group opens 3080 to reach this block.
# LAZILY RESOLVED, and that is the whole point of the variable. nginx resolves a literal
# upstream at STARTUP and exits if the name is missing, so with `proxy_pass http://api:3080`
# the entire site refused to start whenever the LibreChat profile was down: the concurrency
# curve, which is the mandatory deliverable, was taken offline by an optional chat service.
server {
    listen 3080 ssl;
    server_name the-phoenix.cricheroes.io;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Model answers can take up to 60s (ASK_TIMEOUT_MS); default 60s would cut them off mid-arrival.
    proxy_read_timeout 90s;

    location / {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $librechat_host "api:3080";
        proxy_pass http://$librechat_host;
        # LibreChat streams and uses websockets; without the upgrade headers the chat hangs open
        # and returns nothing, which looks exactly like a broken model key.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
