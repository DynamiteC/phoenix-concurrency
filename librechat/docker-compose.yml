# Trimmed from the vendored LibreChat compose file. The Phoenix Ask flow posts straight to
# LibreChat's agents endpoint (frontend/src/lib/ask.ts), so only api + mongodb are needed here;
# mcp-clickhouse is added by the override. rag_api, vectordb, meilisearch, and admin-panel were
# removed on purpose: no file-upload RAG, no chat search, no admin UI in this deployment.
#
# All services carry `profiles: ["chat"]` so a plain `docker compose up -d` on the root file
# starts only the core Phoenix containers; add `--profile chat` to bring the chat stack up.

services:
  api:
    container_name: LibreChat
    profiles: ["chat"]
    # NOT published. The proxy terminates TLS on host port 3080 and reaches this container as
    # api:3080 on the compose network; LibreChat's SPA cannot live under a path prefix (its
    # <base href="/"> 404s every asset), so it gets the whole port instead.
    expose:
      - "${PORT}"
    depends_on:
      - mongodb
    image: registry.librechat.ai/danny-avila/librechat-dev:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - PROXY=${PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},${no_proxy:-},mongodb,chat-mongodb,host.docker.internal
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},${NO_PROXY:-},mongodb,chat-mongodb,host.docker.internal
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./skill:/app/skill
  mongodb:
    container_name: chat-mongodb
    profiles: ["chat"]
    image: mongo:7.0
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
